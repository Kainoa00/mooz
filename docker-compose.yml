services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/etc/livekit.yaml", "--dev", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL:-ws://localhost:7880}"
      LIVEKIT_API_URL: http://livekit:7880
      MOOZ_PUBLIC_URL: "${MOOZ_PUBLIC_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-secret}"
      MOOZ_DB_PATH: /data/mooz.db
    volumes:
      - mooz-data:/data
    ports:
      - "3000:3000"
    depends_on:
      - livekit

volumes:
  mooz-data:
