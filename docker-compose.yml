services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml", "--dev", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # Local only: the dev keys are public. See docs before exposing LiveKit on a network.
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL:-ws://localhost:7880}"
      LIVEKIT_API_URL: http://livekit:7880
      MOOZ_PUBLIC_URL: "${MOOZ_PUBLIC_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-secret}"
      MOOZ_DB_PATH: /data/mooz.db
      MOOZ_ROOMS_PER_MINUTE: "${MOOZ_ROOMS_PER_MINUTE:-}"
      MOOZ_MAX_CONNECTORS: "${MOOZ_MAX_CONNECTORS:-}"
      MOOZ_CONNECTORS_PER_MINUTE: "${MOOZ_CONNECTORS_PER_MINUTE:-}"
    volumes:
      - mooz-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - livekit

volumes:
  mooz-data:
