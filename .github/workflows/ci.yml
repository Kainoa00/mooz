name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/web exec vitest run --coverage

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Start LiveKit dev server
        run: docker compose up -d livekit
        working-directory: .
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # Unit + integration (against the LiveKit dev server); live API tests are opt-in.
      - run: uv run pytest -m "not live" --cov --cov-fail-under=80

  e2e:
    runs-on: ubuntu-latest
    needs: [web, bridge]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Start LiveKit dev server
        run: docker compose up -d livekit
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - run: uv sync --locked
        working-directory: bridge
      - run: pnpm -C apps/web test:e2e
        env:
          MOOZ_BRIDGE_DIR: ${{ github.workspace }}/bridge

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t mooz-web:ci .
      - name: The production kit's settings are complete
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env.example config --quiet
      - name: Runs with a strong secret
        run: |
          docker run -d --name web -p 127.0.0.1:3000:3000 \
            -e LIVEKIT_URL=wss://livekit.example.com -e LIVEKIT_API_KEY=mooz \
            -e LIVEKIT_API_SECRET="$(openssl rand -base64 48)" \
            -e MOOZ_PUBLIC_URL=https://meet.example.com -e MOOZ_DB_PATH=/data/mooz.db mooz-web:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/ready | grep -q '"ok":true'
          curl -sf -o /dev/null http://127.0.0.1:3000/mooz-pcm-worklet.js
          curl -sfI http://127.0.0.1:3000/ | grep -qi '^content-security-policy:'
      - name: Show its logs
        if: failure()
        run: docker logs web
      - name: Refuses to start with a weak secret
        run: |
          status=0
          timeout 60 docker run --rm \
            -e LIVEKIT_URL=wss://livekit.example.com -e LIVEKIT_API_KEY=mooz -e LIVEKIT_API_SECRET=secret \
            -e MOOZ_PUBLIC_URL=https://meet.example.com mooz-web:ci || status=$?
          # 124 is the timeout: it kept running, which is the failure.
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then echo "it started with a weak secret"; exit 1; fi
