name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/web exec vitest run --coverage

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Start LiveKit dev server
        run: docker compose up -d livekit
        working-directory: .
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # Unit + integration (against the LiveKit dev server); live API tests are opt-in.
      - run: uv run pytest -m "not live" --cov --cov-fail-under=80

  e2e:
    runs-on: ubuntu-latest
    needs: [web, bridge]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Start LiveKit dev server
        run: docker compose up -d livekit
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - run: uv sync --locked
        working-directory: bridge
      - run: pnpm -C apps/web test:e2e
        env:
          MOOZ_BRIDGE_DIR: ${{ github.workspace }}/bridge
