# LiveKit media server config for local development.
# API keys come from LIVEKIT_KEYS (set by docker-compose.yml from .env).
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
logging:
  level: info
# Lets the web app kick removed agents that try to rejoin. api_key must be one of
# the keys in LIVEKIT_KEYS (the dev key here).
webhook:
  api_key: devkey
  urls:
    - http://web:3000/api/livekit/webhook
